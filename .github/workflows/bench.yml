name: RPS Arena â€” haftalÄ±k benchmark

on:
  schedule:
    - cron: '0 6 * * 1'   # her pazartesi 06:00 UTC
  workflow_dispatch: {}     # elle tetikleme

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  # 1) Her Node sÃ¼rÃ¼mÃ¼ kendi sonucunu ARTIFACT olarak Ã¼retir â€” kimse commit atmaz
  bench:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: BaÄŸÄ±mlÄ±lÄ±klar
        run: npm ci

      - name: Testler (geÃ§meden benchmark yok)
        run: npm test

      - name: Benchmark koÅŸ
        run: node bench/runner.js --label "node-${{ matrix.node }}" --out "run-node-${{ matrix.node }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: run-node-${{ matrix.node }}
          path: run-node-${{ matrix.node }}.json
          retention-days: 7

  # 2) Tek job hepsini birleÅŸtirir, TEK commit atar â€” yarÄ±ÅŸ koÅŸulu imkÃ¢nsÄ±z
  collect:
    needs: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: tmp_runs
          merge-multiple: true

      - name: SonuÃ§larÄ± birleÅŸtir (ÅŸema doÄŸrulamalÄ±)
        run: node bench/merge.js tmp_runs/run-node-*.json

      - name: Tek commit + push
        run: |
          git config user.name "rps-arena-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results/results.json
          git diff --cached --quiet && echo "deÄŸiÅŸiklik yok" && exit 0
          git commit -m "bench: haftalÄ±k sonuÃ§lar ($(date -u +%Y-%m-%d))"
          git push origin main

  # 3) Panoyu yayÄ±nla
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Site paketini hazÄ±rla
        run: |
          git pull origin main
          mkdir -p _site
          cp site/index.html _site/index.html
          cp results/results.json _site/results.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4